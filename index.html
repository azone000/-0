<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>自訂義霓虹碼錶</title>

    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <meta name="apple-mobile-web-app-title" content="霓虹碼錶">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入多種字體供使用者切換 */
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Inter:wght@700&family=Varela+Round&family=Righteous&family=Noto+Sans+TC:wght@400;700&display=swap');

        /* 定義 CSS 變數來控制全局主題與字體 */
        :root {
            --theme-main: #22d3ee;       /* 亮色 (主文字/發光) */
            --theme-border: #0891b2;     /* 暗色 (邊框/次要文字) */
            --theme-dim: rgba(8, 145, 178, 0.3); /* 按下時的背景色 */
            --theme-glow: rgba(34, 211, 238, 0.5); /* 陰影發光色 */
            
            --dynamic-font: 'Black Ops One', monospace;
            --dynamic-tracking: 2px;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, sans-serif;
            background-color: #000000;
            color: #ffffff;
            overscroll-behavior-y: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 動態套用的字體類別 */
        .dynamic-font {
            font-family: var(--dynamic-font);
            font-variant-numeric: tabular-nums;
            letter-spacing: var(--dynamic-tracking);
        }

        /* 隱藏捲動軸 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 動態顏色類別 */
        .text-theme { color: var(--theme-main); }
        .text-theme-dark { color: var(--theme-border); }
        .border-theme { border-color: var(--theme-main); }
        .border-theme-dark { border-color: var(--theme-border); }
        .shadow-theme-glow { text-shadow: 0 0 10px var(--theme-glow); }
        .box-shadow-theme { box-shadow: 0 0 15px var(--theme-glow); }
        .bg-theme-active:active { background-color: var(--theme-dim); }

        /* 設定面板過場動畫 */
        #settings-modal {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 按鈕基礎樣式 */
        .btn-wrapper {
            padding: 4px;
            border-radius: 9999px;
            border: 2px solid transparent; 
        }

        /* 字型選擇器的活躍狀態 */
        .font-option.active {
            border-color: var(--theme-main);
            color: var(--theme-main);
        }
        /* 顏色選擇器的活躍狀態 */
        .color-option.active {
            transform: scale(1.15);
            border: 2px solid white;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden bg-black relative">

    <button id="btn-settings" class="fixed bottom-12 right-6 z-50 text-white/70 hover:text-white transition-all p-3 bg-[#1c1c1e]/80 rounded-full backdrop-blur-md active:scale-95 border border-white/10 shadow-[0_4px_15px_rgba(0,0,0,0.5)]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
    </button>

    <div class="flex flex-col justify-center items-center pt-[75px] pb-4 px-4 w-full z-10 relative">
        <div class="border-2 border-theme rounded-xl px-4 md:px-6 py-2 flex items-baseline tracking-widest box-shadow-theme transition-colors duration-300">
            <span id="clock-hm" class="text-theme text-5xl md:text-6xl dynamic-font shadow-theme-glow transition-colors duration-300">--:--</span>
            <span id="clock-s" class="text-theme opacity-60 text-2xl md:text-3xl dynamic-font ml-1.5 md:ml-2 font-bold transition-colors duration-300">--</span>
        </div>
        <div id="clock-day" class="text-theme opacity-80 text-lg md:text-xl tracking-widest mt-3 font-bold transition-colors duration-300">載入中...</div>
    </div>

    <div class="flex justify-center items-center pt-2 pb-8 z-10">
        <h1 id="main-timer" class="text-[5rem] md:text-[6rem] dynamic-font text-theme shadow-theme-glow leading-none transition-colors duration-300">
            00:00.00
        </h1>
    </div>

    <div class="flex justify-between px-8 pb-4 z-10">
        <div class="btn-wrapper border-theme-dark transition-colors duration-300" id="btn-left-wrapper">
            <button id="btn-left" class="w-16 h-16 md:w-20 md:h-20 rounded-full flex justify-center items-center bg-transparent border-2 border-theme-dark text-theme font-bold text-lg bg-theme-active transition-colors duration-300">
                分圈
            </button>
        </div>
        <div class="btn-wrapper border-theme transition-colors duration-300" id="btn-right-wrapper">
            <button id="btn-right" class="w-16 h-16 md:w-20 md:h-20 rounded-full flex justify-center items-center bg-transparent border-2 border-theme text-theme font-bold text-lg bg-theme-active box-shadow-theme transition-colors duration-300">
                開始
            </button>
        </div>
    </div>

    <div class="flex-grow overflow-y-auto no-scrollbar px-6 pb-6 border-t border-theme-dark transition-colors duration-300 relative z-10">
        <div id="laps-container" class="flex flex-col">
            <div class="text-center text-theme opacity-50 text-sm mt-8 tracking-widest transition-colors duration-300">SYSTEM READY</div>
        </div>
    </div>
    
    <div class="fixed bottom-0 left-0 w-full h-8 bg-gradient-to-t from-black to-transparent pointer-events-none z-20"></div>

    <div id="settings-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity duration-300"></div>
    
    <div id="settings-modal" class="fixed bottom-0 left-0 w-full bg-[#1c1c1e] rounded-t-3xl p-6 z-50 transform translate-y-full flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-white text-lg font-bold tracking-wider">字型與顏色</h2>
            <button id="btn-close-settings" class="bg-[#2c2c2e] rounded-full p-1.5 text-gray-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="flex justify-between items-center mb-8 px-2">
            <div class="font-option active w-14 h-16 rounded-xl border-2 border-gray-600 flex justify-center items-center text-3xl text-gray-400 cursor-pointer transition-colors" data-font="'Black Ops One', monospace" data-tracking="2px" style="font-family: 'Black Ops One'">12</div>
            <div class="font-option w-14 h-16 rounded-xl border-2 border-gray-600 flex justify-center items-center text-3xl text-gray-400 cursor-pointer transition-colors" data-font="'Righteous', cursive" data-tracking="1px" style="font-family: 'Righteous'">12</div>
            <div class="font-option w-14 h-16 rounded-xl border-2 border-gray-600 flex justify-center items-center text-3xl text-gray-400 cursor-pointer transition-colors" data-font="'Inter', sans-serif" data-tracking="0px" style="font-family: 'Inter', sans-serif; font-weight: 700;">12</div>
            <div class="font-option w-14 h-16 rounded-xl border-2 border-gray-600 flex justify-center items-center text-3xl text-gray-400 cursor-pointer transition-colors" data-font="'Varela Round', sans-serif" data-tracking="1px" style="font-family: 'Varela Round'">12</div>
        </div>

        <div class="w-full h-[1px] bg-gray-700 mb-8"></div>

        <div class="flex justify-between items-center px-1 pb-4 overflow-x-auto no-scrollbar space-x-4">
            <div class="color-option active w-10 h-10 rounded-full cursor-pointer flex-shrink-0 transition-transform" style="background-color: #22d3ee;" data-theme="cyan"></div>
            <div class="color-option w-10 h-10 rounded-full cursor-pointer flex-shrink-0 transition-transform" style="background-color: #4ade80;" data-theme="green"></div>
            <div class="color-option w-10 h-10 rounded-full cursor-pointer flex-shrink-0 transition-transform" style="background-color: #fb923c;" data-theme="orange"></div>
            <div class="color-option w-10 h-10 rounded-full cursor-pointer flex-shrink-0 transition-transform" style="background-color: #f87171;" data-theme="red"></div>
            <div class="color-option w-10 h-10 rounded-full cursor-pointer flex-shrink-0 transition-transform" style="background-color: #60a5fa;" data-theme="blue"></div>
            <div class="color-option w-10 h-10 rounded-full cursor-pointer flex-shrink-0 transition-transform" style="background-color: #f9fafb;" data-theme="white"></div>
        </div>
    </div>

    <script>
        // === 主題配置表 (重新調配大眾高對比色系) ===
        const themes = {
            cyan: { main: '#22d3ee', border: '#0891b2', dim: 'rgba(8, 145, 178, 0.3)', glow: 'rgba(34, 211, 238, 0.5)' },
            green: { main: '#4ade80', border: '#16a34a', dim: 'rgba(22, 163, 74, 0.3)', glow: 'rgba(74, 222, 128, 0.5)' },
            orange: { main: '#fb923c', border: '#ea580c', dim: 'rgba(234, 88, 12, 0.3)', glow: 'rgba(251, 146, 60, 0.5)' },
            red: { main: '#f87171', border: '#dc2626', dim: 'rgba(220, 38, 38, 0.3)', glow: 'rgba(248, 113, 113, 0.5)' },
            blue: { main: '#60a5fa', border: '#2563eb', dim: 'rgba(37, 99, 235, 0.3)', glow: 'rgba(96, 165, 250, 0.5)' },
            white: { main: '#ffffff', border: '#4b5563', dim: 'rgba(75, 85, 99, 0.3)', glow: 'rgba(255, 255, 255, 0.3)' }
        };

        // === DOM 元素 ===
        const DOM = {
            mainTimer: document.getElementById('main-timer'),
            btnLeft: document.getElementById('btn-left'),
            btnLeftWrap: document.getElementById('btn-left-wrapper'),
            btnRight: document.getElementById('btn-right'),
            btnRightWrap: document.getElementById('btn-right-wrapper'),
            lapsContainer: document.getElementById('laps-container'),
            
            btnSettings: document.getElementById('btn-settings'),
            btnCloseSettings: document.getElementById('btn-close-settings'),
            settingsModal: document.getElementById('settings-modal'),
            settingsOverlay: document.getElementById('settings-overlay'),
            fontOptions: document.querySelectorAll('.font-option'),
            colorOptions: document.querySelectorAll('.color-option'),
            root: document.documentElement
        };

        // === 設定面板邏輯 ===
        function toggleSettings() {
            const isClosed = DOM.settingsModal.classList.contains('translate-y-full');
            if (isClosed) {
                DOM.settingsModal.classList.remove('translate-y-full');
                DOM.settingsOverlay.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                DOM.settingsModal.classList.add('translate-y-full');
                DOM.settingsOverlay.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        DOM.btnSettings.addEventListener('click', toggleSettings);
        DOM.btnCloseSettings.addEventListener('click', toggleSettings);
        DOM.settingsOverlay.addEventListener('click', toggleSettings);

        // 字型切換
        DOM.fontOptions.forEach(option => {
            option.addEventListener('click', function() {
                DOM.fontOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                
                const newFont = this.getAttribute('data-font');
                const newTracking = this.getAttribute('data-tracking');
                DOM.root.style.setProperty('--dynamic-font', newFont);
                DOM.root.style.setProperty('--dynamic-tracking', newTracking);
            });
        });

        // 顏色切換
        DOM.colorOptions.forEach(option => {
            option.addEventListener('click', function() {
                DOM.colorOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                
                const themeKey = this.getAttribute('data-theme');
                const t = themes[themeKey];
                
                DOM.root.style.setProperty('--theme-main', t.main);
                DOM.root.style.setProperty('--theme-border', t.border);
                DOM.root.style.setProperty('--theme-dim', t.dim);
                DOM.root.style.setProperty('--theme-glow', t.glow);

                // 重新渲染按鈕
                if(isRunning) {
                    setButtonState('stop');
                    setButtonState('lap');
                } else {
                    if (totalElapsedTime > 0) {
                        setButtonState('start');
                        setButtonState('reset');
                    } else {
                        setButtonState('start');
                        setButtonState('lap-disabled');
                    }
                }
            });
        });

        // === 頂部時鐘更新 ===
        function updateClock() {
            const now = new Date();
            const twTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Taipei"}));
            
            const hours = String(twTime.getHours()).padStart(2, '0');
            const minutes = String(twTime.getMinutes()).padStart(2, '0');
            const seconds = String(twTime.getSeconds()).padStart(2, '0');
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            
            document.getElementById('clock-hm').innerText = `${hours}:${minutes}`;
            document.getElementById('clock-s').innerText = seconds;
            document.getElementById('clock-day').innerText = days[twTime.getDay()];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // === 碼錶核心邏輯 ===
        let isRunning = false;
        let totalElapsedTime = 0;      
        let currentLapElapsedTime = 0; 
        let lastTickTime = 0;
        let animationFrameId;
        let laps = []; 

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((ms % 1000) / 10);

            const mStr = minutes.toString().padStart(2, '0');
            const sStr = seconds.toString().padStart(2, '0');
            const cStr = centiseconds.toString().padStart(2, '0');

            return `${mStr}:${sStr}.${cStr}`;
        }

        // 動態改變按鈕樣式 (使用 CSS 變數)
        function setButtonState(type) {
            const baseBtn = "w-16 h-16 md:w-20 md:h-20 rounded-full flex justify-center items-center bg-transparent border-2 font-bold text-lg transition-all ";
            
            if (type === 'start') {
                DOM.btnRightWrap.className = "btn-wrapper border-theme transition-colors duration-300";
                DOM.btnRight.className = baseBtn + "border-theme text-theme bg-theme-active box-shadow-theme";
                DOM.btnRight.innerText = "開始";
            } else if (type === 'stop') {
                DOM.btnRightWrap.style.borderColor = '#dc2626'; // 固定紅色外框
                DOM.btnRightWrap.className = "btn-wrapper transition-colors duration-300";
                DOM.btnRight.className = baseBtn + "border-[#f87171] text-[#f87171] active:bg-[#dc2626]/30 shadow-[0_0_10px_rgba(248,113,113,0.3)]";
                DOM.btnRight.innerText = "停止";
            } else if (type === 'lap') {
                DOM.btnLeftWrap.className = "btn-wrapper border-theme-dark transition-colors duration-300"; 
                DOM.btnLeft.className = baseBtn + "border-theme-dark text-theme bg-theme-active";
                DOM.btnLeft.innerText = "分圈";
            } else if (type === 'lap-disabled') {
                DOM.btnLeftWrap.className = "btn-wrapper border-theme-dark transition-colors duration-300"; 
                DOM.btnLeftWrap.style.borderColor = 'rgba(255,255,255,0.1)';
                DOM.btnLeft.className = baseBtn + "text-theme-dark border-transparent";
                DOM.btnLeft.style.borderColor = 'rgba(255,255,255,0.1)';
                DOM.btnLeft.innerText = "分圈";
            } else if (type === 'reset') {
                DOM.btnLeftWrap.className = "btn-wrapper border-theme-dark transition-colors duration-300";
                DOM.btnLeft.className = baseBtn + "border-theme-dark text-theme bg-theme-active";
                DOM.btnLeft.innerText = "重置";
            }
        }

        function tick() {
            if (isRunning) {
                const now = Date.now();
                const delta = now - lastTickTime;
                totalElapsedTime += delta;
                currentLapElapsedTime += delta;
                lastTickTime = now;

                DOM.mainTimer.innerText = formatTime(totalElapsedTime);
                renderLaps(); 
                
                animationFrameId = requestAnimationFrame(tick);
            }
        }

        function renderLaps() {
            if (laps.length === 0 && !isRunning && totalElapsedTime === 0) {
                DOM.lapsContainer.innerHTML = '<div class="text-center text-theme opacity-50 text-sm mt-8 tracking-widest transition-colors duration-300">SYSTEM READY</div>';
                return;
            }

            let html = '';
            let maxTime = -1;
            let minTime = Infinity;
            
            if (laps.length >= 2) {
                laps.forEach(lap => {
                    if (lap.lapTime > maxTime) maxTime = lap.lapTime;
                    if (lap.lapTime < minTime) minTime = lap.lapTime;
                });
            }

            // 當前圈
            if (isRunning || laps.length > 0) {
                const currentLapNum = laps.length + 1;
                html += `
                    <div class="flex justify-between items-center py-4 border-b border-theme-dark transition-colors duration-300">
                        <span class="text-theme font-bold text-[17px] tracking-wider transition-colors duration-300">LAP ${currentLapNum}</span>
                        <span class="text-theme text-xl dynamic-font transition-colors duration-300">${formatTime(currentLapElapsedTime)}</span>
                    </div>
                `;
            }

            // 歷史圈數
            for (let i = laps.length - 1; i >= 0; i--) {
                const lap = laps[i];
                let colorClass = 'text-theme opacity-80'; // 預設使用主色稍暗
                let labelText = '';
                let borderClass = 'border-theme opacity-80';
                
                if (laps.length >= 2) {
                    if (lap.lapTime === maxTime) {
                        colorClass = 'text-[#f87171]'; // 最慢圈固定用紅色警示
                        borderClass = 'border-[#f87171]';
                        labelText = `<span class="text-[10px] ml-2 border ${borderClass} px-1.5 py-0.5 rounded ${colorClass} tracking-wider">MAX</span>`;
                    } else if (lap.lapTime === minTime) {
                        colorClass = 'text-theme font-bold'; // 最快圈用最亮的主色
                        borderClass = 'border-theme';
                        labelText = `<span class="text-[10px] ml-2 border ${borderClass} px-1.5 py-0.5 rounded text-theme tracking-wider box-shadow-theme transition-colors duration-300">MIN</span>`;
                    }
                }

                html += `
                    <div class="flex justify-between items-center py-4 border-b border-theme-dark transition-colors duration-300">
                        <div class="flex items-center">
                            <span class="${colorClass} font-bold text-[17px] tracking-wider transition-colors duration-300">LAP ${lap.id}</span>
                            ${labelText}
                        </div>
                        <span class="${colorClass} text-xl dynamic-font transition-colors duration-300">${formatTime(lap.lapTime)}</span>
                    </div>
                `;
            }

            DOM.lapsContainer.innerHTML = html;
        }

        DOM.btnRight.addEventListener('click', () => {
            if (isRunning) {
                isRunning = false;
                cancelAnimationFrame(animationFrameId);
                
                const now = Date.now();
                const delta = now - lastTickTime;
                totalElapsedTime += delta;
                currentLapElapsedTime += delta;
                DOM.mainTimer.innerText = formatTime(totalElapsedTime);
                renderLaps(); 

                setButtonState('start');
                setButtonState('reset');
            } else {
                isRunning = true;
                lastTickTime = Date.now();
                
                setButtonState('stop');
                setButtonState('lap');
                
                if(laps.length === 0 && currentLapElapsedTime === 0) renderLaps();
                animationFrameId = requestAnimationFrame(tick);
            }
        });

        DOM.btnLeft.addEventListener('click', () => {
            if (isRunning) {
                const now = Date.now();
                const delta = now - lastTickTime;
                totalElapsedTime += delta;
                currentLapElapsedTime += delta;
                lastTickTime = now;

                laps.push({
                    id: laps.length + 1,
                    lapTime: currentLapElapsedTime,
                    totalTime: totalElapsedTime
                });
                
                currentLapElapsedTime = 0; 
                renderLaps();
                
            } else {
                if (totalElapsedTime > 0) {
                    totalElapsedTime = 0;
                    currentLapElapsedTime = 0;
                    laps = [];
                    DOM.mainTimer.innerText = "00:00.00";
                    renderLaps();
                    setButtonState('lap-disabled');
                }
            }
        });

        // 初始化狀態
        setButtonState('lap-disabled');

    </script>
</body>
</html>
